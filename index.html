<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="상가관리비">
<title>상가관리비 관리</title>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#1f2937; --sub:#4b5563; --line:#eceef4;
  --brand:#6366f1; --brand-soft:#eef2ff; --ok:#10b981; --ok-soft:#ecfdf5;
  --warn:#f59e0b; --warn-soft:#fffbeb; --bad:#ef4444; --bad-soft:#fef2f2;
  --radius:18px; --grad:linear-gradient(135deg,#6366f1,#8b5cf6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
label{font-size:14px;color:var(--sub);display:block;margin-bottom:4px;font-weight:700}
.main{max-width:860px;margin:0 auto;padding:10px;padding-bottom:170px}
.mobiletop{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#4338ca,#6d28d9);color:#fff;padding:10px 12px;font-weight:800;position:sticky;top:0;z-index:40;gap:6px;flex-wrap:wrap}
#brand{font-size:20px}
.mobiletop small{color:#c7d2fe;font-weight:400;font-size:12px}
.mobiletop .btn{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:15px;font-weight:700;padding:8px 12px;border-radius:12px}
.card{background:var(--card);border:none;border-radius:var(--radius);padding:13px;margin-bottom:9px;box-shadow:0 1px 2px rgba(17,24,39,.05),0 6px 20px rgba(17,24,39,.05)}
.card h2{font-size:17px;font-weight:800;margin-bottom:9px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:12px;font-size:15px;font-weight:700;min-height:44px}
.btn.primary{background:var(--grad);border:none;color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3)}
.btn.danger{color:var(--bad);border-color:#fecaca}
.btn.sm{padding:6px 10px;font-size:13px;min-height:36px}
.btn.ghost{border:none;background:none;color:var(--brand)}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)} .b-gray{background:#f1f5f9;color:var(--sub)} .b-brand{background:var(--brand-soft);color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--sub);font-size:13px;font-weight:800;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:#f8fafc}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1} .mt{margin-top:10px}
.muted{color:var(--sub);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.item{background:#f6f7fd;border-radius:14px;padding:9px 11px}
.item .k{font-size:14px;color:var(--sub);font-weight:700}
.item .v{font-size:19px;font-weight:800;margin-top:2px}
.empty{text-align:center;color:var(--sub);padding:16px;font-size:15px}
.tabbar{display:flex;position:fixed;bottom:8px;left:10px;right:10px;max-width:840px;margin:0 auto;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-radius:22px;box-shadow:0 6px 22px rgba(49,46,129,.18);z-index:40;padding:4px 5px calc(4px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;background:none;border:none;padding:5px 1px 6px;font-size:15px;font-weight:800;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:15px;margin:0 2px;white-space:nowrap}
.tabbar button .ico{font-size:17px}
.tabbar button.active{color:var(--brand);background:var(--brand-soft)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#312e81;color:#fff;padding:10px 20px;border-radius:99px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;justify-content:center}
.seg button.on{background:var(--grad);color:#fff;border:none;box-shadow:0 4px 12px rgba(99,102,241,.3)}
.copybox{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:18px;white-space:pre-wrap;line-height:1.7}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  .tabbar,.mobiletop{display:none}
}
</style>
</head>
<body>
<div id="lockScreen" style="position:fixed;inset:0;background:linear-gradient(160deg,#312e81 0%,#1e1b4b 60%,#0f0d2e 100%);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px">
  <div style="font-size:40px">🏢</div>
  <div style="color:#fff;font-weight:800;font-size:18px" id="lockTitle">상가관리비 관리</div>
  <div style="color:#94a3b8;font-size:13px">이메일로 로그인하세요</div>
  <input type="email" id="authEmail" placeholder="이메일" style="max-width:270px;padding:12px">
  <input type="password" id="authPw" placeholder="비밀번호 (6자 이상)" style="max-width:270px;padding:12px" onkeydown="if(event.key==='Enter')fbLogin()">
  <button class="btn primary" style="width:270px;justify-content:center;padding:12px" onclick="fbLogin()">로그인</button>
  <button class="btn" style="width:270px;justify-content:center" onclick="fbSignup()">처음이신가요? 회원가입</button>
  <a href="#" style="color:#64748b;font-size:12px" onclick="fbReset();return false">비밀번호를 잊으셨나요?</a>
  <div id="lockMsg" style="color:#f87171;font-size:13px;min-height:18px;text-align:center"></div>
  <div style="color:#4c4a7a;font-size:11.5px;text-align:center">☁️ 데이터는 본인 계정의 클라우드에 저장됩니다<br>버전 b0715e</div>
</div>

<div class="mobiletop"><div id="brand">🏢 상가관리비 <small id="brandSub"></small></div>
  <div class="row" style="gap:6px">
    <button class="btn" onclick="go('settings')">⚙️</button></div></div>
<main class="main" id="main"></main>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>
<div id="printArea" style="display:none"></div>
<input type="file" id="importFile" accept=".json" style="display:none">

<script>
/* 오류 진단: 문제가 생기면 로그인 화면에 원인을 표시 */
window.addEventListener('error',function(e){var el=document.getElementById('lockMsg');if(el&&e.message)el.textContent='⚠️ 오류: '+e.message;});
window.addEventListener('unhandledrejection',function(e){var el=document.getElementById('lockMsg');var r=e.reason;if(el)el.textContent='⚠️ 오류: '+((r&&(r.code||r.message))||r||'알 수 없음');});
setTimeout(function(){if(!window.fbLogin){var el=document.getElementById('lockMsg');if(el)el.textContent='⚠️ 로그인 모듈을 불러오지 못했습니다 — 인터넷 연결을 확인하고, 카카오톡 안이 아닌 사파리/크롬 브라우저에서 열어주세요';}},4000);
</script>
<script>
/* ═══════════ 기본 ═══════════ */
const DBKEY='bldgadmin_v1';
const APP_VER='b0715e';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>iso(new Date());
const thisYM=()=>todayStr().slice(0,7);
const fmt=n=>(Math.round(n)||0).toLocaleString('ko-KR');
const fmtDate=ds=>ds?ds.replace(/-/g,'.'):'-';
const fmtMD=ds=>ds?ds.slice(5).replace('-','.'):'-';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPhone=s=>{const d=String(s||'').replace(/[^0-9]/g,'');if(d.length===11)return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);if(d.length===10)return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);return s||'';};
function fmtPhoneInput(el){const d=el.value.replace(/[^0-9]/g,'').slice(0,11);let out=d;
  if(d.length>7)out=d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(-4);
  else if(d.length>3)out=d.slice(0,3)+'-'+d.slice(3);el.value=out;}

/* ── 2개월 청구 주기: 기록의 연월 = 청구기간 첫 달 (예: 2026-05 → 5·6월분, 지침 5.1→7.1) ── */
const perMonths=ym=>{const m=Number(ym.slice(5,7));const m2=m===12?1:m+1;const m3=m2===12?1:m2+1;return[m,m2,m3];};
const perLabel=ym=>{const[a,b]=perMonths(ym);return a+'·'+b+'월';};
/* 청구월(계산월) = 사용기간 시작월 + 2. 예: 5·6월분(키 2026-05) → 2026년 7월 청구 */
const billYM=ym=>prevYM(ym,-2);
const billLabel=ym=>{const b=billYM(ym);return b.slice(0,4)+'년 '+Number(b.slice(5,7))+'월';};
/* 오늘 기준 진행 중인 청구월의 기록 키. 7월→7월 청구(5·6월분), 8월→9월 청구(7·8월분) */
const curPeriodYM=()=>{const t=todayStr();let y=Number(t.slice(0,4)),m=Number(t.slice(5,7));
  let bm=m%2===1?m:m+1;if(bm>12){bm=1;y++;}
  return prevYM(y+'-'+pad(bm),2);};
/* 공과금 입력 항목 (고지서 금액 입력칸) */
const utilFields=ym=>{const[a,b]=perMonths(ym);return[
 ['water1','1층 계량기 요금'],
 ['water2','2층 계량기 요금'],
 ['water3','3층 계량기 요금'],
 ['waterMain','메인 계량기 요금(전체)'],
 ['elec1','공용전기 '+a+'월'],
 ['elec2','공용전기 '+b+'월'],
 ['septic','정화조 청소비'],
 ['safety','전기·소방안전관리비'],
 ['mgmt','상가관리비'],
 ['clean','상가청소비'],
 ['etc','기타비용']];};
/* 업체별 분담 가중치 항목 (수도 1·2층은 계량기 사용량 기준 배분) */
const COSTS=[
 ['waterCommon','전체 공용수도'],
 ['elec','공용전기'],
 ['septic','정화조 청소비'],
 ['safety','전기·소방안전'],
 ['mgmt','상가관리비'],
 ['clean','상가청소비'],
 ['etc','기타비용']];
/* 청구 항목 키 → 표시명 */
const ITEM_KEYS=['waterOwn','waterFC','waterAC','elec1','elec2','septic','safety','mgmt','clean','etc'];
const itemLabel=(k,ym)=>{const[a,b]=perMonths(ym);return{waterOwn:'전용 수도요금',waterFC:'층 공용 수도요금',waterAC:'전체 공용수도',elec1:'공용전기 '+a+'월',elec2:'공용전기 '+b+'월',septic:'정화조 청소비',safety:'전기·소방안전관리비',mgmt:'상가관리비',clean:'상가청소비',etc:'기타비용'}[k]||k;};
/* 공용비 배분: [금액키, 가중치키] — 전기 1·2는 같은 가중치(elec) 사용 */
const SHARE=[['elec1','elec'],['elec2','elec'],['septic','septic'],['safety','safety'],['mgmt','mgmt'],['clean','clean'],['etc','etc']];

function load(){
  try{const d=JSON.parse(localStorage.getItem(DBKEY));if(d&&d.shops)return d;}catch(e){}
  return {shops:[],months:{},ledger:[],settings:{}};
}
let db=load();
function migrateDb(){
  db.shops=db.shops||[];db.months=db.months||{};db.ledger=db.ledger||[];
  db.settings=Object.assign({buildingName:'우리상가',account:'',mgr:'',unitRound:10,dispRound:100,shareRound:10,lastBackup:'',curPeriod:'',openBal:{},meterNos:{water1:'38407221',water2:'38407249',waterCommon:'37934315',water3:'38407258'}},db.settings||{});
  db.shops.forEach(s=>{s.part=s.part||{};COSTS.forEach(([k])=>{if(s.part[k]==null)s.part[k]=1;});
    if(s.wFloor==null)s.wFloor=(s.part.water12>0)?1:0;
    if(s.wcFloor==null)s.wcFloor=1;
    if(s.wcW==null)s.wcW=1;});
  // 구버전 데이터 이관: water12 금액→water1, elec→elec1
  Object.values(db.months||{}).forEach(M=>{if(!M.utils)return;
    if(M.utils.water12!=null&&M.utils.water1==null){M.utils.water1=M.utils.water12;delete M.utils.water12;}
    if(M.utils.elec!=null&&M.utils.elec1==null){M.utils.elec1=M.utils.elec;delete M.utils.elec;}});
}
migrateDb();
const S=()=>db.settings;
function save(){const j=JSON.stringify(db);localStorage.setItem(DBKEY,j);if(window.queueCloudSave)window.queueCloudSave(j);}
let toastTimer;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2000);}
function copyText(text,msg){navigator.clipboard?.writeText(text).then(()=>toast(msg||'복사되었습니다')).catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg||'복사되었습니다');});}

/* ═══════════ 계산 엔진 ═══════════ */
const roundTo=(v,u)=>u>0?Math.round(v/u)*u:Math.round(v);
function activeShops(){return db.shops.filter(s=>s.status!=='공실');}
function prevYM(ym,n){const d=new Date(ym+'-01T00:00:00');d.setMonth(d.getMonth()-(n||1));return d.getFullYear()+'-'+pad(d.getMonth()+1);}
// 미납 이월: 확정된 이전 달들의 (청구+조정-납부) 누계
function carryFor(sid,ym){
  let c=0;
  Object.keys(db.months).filter(k=>k<ym&&db.months[k].confirmed).forEach(k=>{
    const M=db.months[k];const ch=(M.charges||{})[sid];if(!ch)return;
    const p=((M.pays||{})[sid]||{});
    c+=(ch.base||0)+(p.adj||0)-(p.paid||0);
  });
  return c;
}
function calcMonth(ym){
  const M=db.months[ym];if(!M)return null;
  const st=S();
  const shops=activeShops();
  const warns=[];const recon=[];
  const charges={};shops.forEach(s=>charges[s.id]={items:{},usage:0});
  // ── 수도: 층 계량기 기준 전용·층공용·전체공용 ──
  M.floorMeters=M.floorMeters||{};
  const U=M.utils||{};
  const floorBills=[0,Number(U.water1)||0,Number(U.water2)||0,Number(U.water3)||0];
  M.waterUnits={};
  for(let f=1;f<=3;f++){
    const bill=floorBills[f];
    const fm=M.floorMeters[f]=M.floorMeters[f]||{base:'',curr:''};
    const subs=shops.filter(s=>(Number(s.wFloor)||0)===f);
    if(bill<=0)continue;
    if(fm.curr==null||fm.curr===''){warns.push('🚨 '+f+'층 계량기 금월지침 누락 — '+f+'층 수도 계산 불가');recon.push({label:f+'층 수도',amt:bill,sum:0,absorbed:bill,tw:'-'});continue;}
    const fu=(Number(fm.curr)||0)-(Number(fm.base)||0);
    if(fu<=0){warns.push('🚨 '+f+'층 계량기 사용량이 0 이하');recon.push({label:f+'층 수도',amt:bill,sum:0,absorbed:bill,tw:'0톤'});continue;}
    const unit=roundTo(bill/fu,st.unitRound);M.waterUnits[f]=unit;
    let ownSum=0;
    subs.forEach(s=>{
      const mt=(M.meters||{})[s.id]||{};
      if(mt.curr==null||mt.curr==='')warns.push('⚠️ '+s.name+': 금월 지침 누락');
      let u=(Number(mt.curr)||0)-(Number(mt.base)||0);
      if(u<0){warns.push('🚨 '+s.name+': 검침값 역전 — 0으로 처리');u=0;}
      charges[s.id].usage=u;
      const own=roundTo(u*unit,st.dispRound);
      charges[s.id].items.waterOwn=(charges[s.id].items.waterOwn||0)+own;ownSum+=own;
    });
    let fc=bill-ownSum;
    if(fc<0){warns.push('⚠️ '+f+'층: 전용요금 합계가 계량기 요금을 '+fmt(-fc)+'원 초과 — 층 공용 0 처리');fc=0;}
    const parts=shops.filter(s=>(Number(s.wcFloor)||0)===f&&(Number(s.wcW)||0)>0);
    const tw=parts.reduce((a,s)=>a+Number(s.wcW),0);
    let fcSum=0;
    if(fc>0&&tw>0){
      parts.forEach(s=>{const v=roundTo(fc*Number(s.wcW)/tw,st.shareRound);charges[s.id].items.waterFC=(charges[s.id].items.waterFC||0)+v;fcSum+=v;});
      const diff=fc-fcSum;
      if(diff!==0){let mx=null;parts.forEach(s=>{if(mx==null||Number(s.wcW)>Number(mx.wcW))mx=s;});
        if(mx){charges[mx.id].items.waterFC+=diff;fcSum=fc;}}
    }else if(fc>0){warns.push('⚠️ '+f+'층 공용 수도요금 '+fmt(fc)+'원: 부담 업체 없음 — 업체관리에서 화장실 이용층을 설정하세요');}
    recon.push({label:f+'층 수도 (단가 '+fmt(unit)+'/톤 · 공용 '+fmt(fc)+'원)',amt:bill,sum:ownSum+fcSum,absorbed:bill-ownSum-fcSum,tw:fu+'톤·가중 '+tw});
  }
  const mainBill=Number(U.waterMain)||0;
  if(mainBill>0){
    const ac=mainBill-(floorBills[1]+floorBills[2]+floorBills[3]);
    if(ac<0)warns.push('⚠️ 메인 계량기 요금이 층별 합계보다 '+fmt(-ac)+'원 작습니다 — 전체 공용 0 처리');
    else if(ac>0){
      const tw=shops.reduce((a,s)=>a+(s.part.waterCommon||0),0);
      if(tw<=0){warns.push('⚠️ 전체 공용수도: 참여 업체 없음');recon.push({label:'전체 공용수도 (메인−층합계)',amt:ac,sum:0,absorbed:ac,tw:0});}
      else{let sum=0;
        shops.forEach(s=>{const w=s.part.waterCommon||0;if(w>0){const v=roundTo(ac*w/tw,st.shareRound);charges[s.id].items.waterAC=v;sum+=v;}});
        const diff=ac-sum;
        if(diff!==0){let mx=null;shops.forEach(s=>{const w=s.part.waterCommon||0;if(w>0&&(mx==null||w>(mx.part.waterCommon||0)))mx=s;});
          if(mx){charges[mx.id].items.waterAC+=diff;sum=ac;}}
        recon.push({label:'전체 공용수도 (메인−층합계)',amt:ac,sum,absorbed:ac-sum,tw});
      }
    }
  }
  // ── 공용비 분담 ──
  SHARE.forEach(([k,wk])=>{
    const label=itemLabel(k,ym);
    const amt=Number((M.utils||{})[k])||0;if(amt<=0)return;
    const tw=shops.reduce((a,s)=>a+(s.part[wk]||0),0);
    if(tw<=0){recon.push({label,amt,sum:0,absorbed:amt,tw:0});warns.push('⚠️ '+label+': 참여 업체 없음(전액 미분담)');return;}
    let sum=0;
    shops.forEach(s=>{const w=s.part[wk]||0;if(w>0){const v=roundTo(amt*w/tw,st.shareRound);charges[s.id].items[k]=v;sum+=v;}});
    const diff=amt-sum;
    if(diff!==0){let mx=null;shops.forEach(s=>{const w=s.part[wk]||0;if(w>0&&(mx==null||w>(mx.part[wk]||0)))mx=s;});
      if(mx){charges[mx.id].items[k]=(charges[mx.id].items[k]||0)+diff;sum=amt;}}
    recon.push({label,amt,sum,absorbed:amt-sum,tw});
  });
  // ── 합계 ──
  shops.forEach(s=>{
    const c=charges[s.id];
    c.base=Object.values(c.items).reduce((a,v)=>a+v,0);
    c.carry=carryFor(s.id,ym);
    const p=((M.pays||{})[s.id]||{});
    c.adj=p.adj||0;
    c.total=c.base+c.carry+c.adj;
  });
  M.charges=charges;M.recon=recon;M.warns=warns;M.calcAt=todayStr();
  return M;
}
function payStatus(M,sid){
  const p=((M.pays||{})[sid]||{});
  if(p.override)return p.override;
  const ch=(M.charges||{})[sid];
  if(!ch||!M.confirmed)return '청구전';
  if(ch.total<=0)return '면제';
  const paid=p.paid||0;
  if(paid<=0)return (M.info&&M.info.due&&todayStr()>M.info.due)?'미납':'청구완료';
  if(paid<ch.total)return '일부납부';
  return '납부완료';
}

function ymOptions(sel){
  const bys=new Set(Object.keys(db.months).map(k=>billYM(k).slice(0,4)));
  bys.add(String(new Date().getFullYear()));
  if(sel)bys.add(billYM(sel).slice(0,4));
  const out=[];
  [...bys].sort().reverse().forEach(y=>{
    for(let bm=11;bm>=1;bm-=2){

      out.push(`<option value="${k}" ${k===sel?'selected':''}>${y}년 ${bm}월 (${perLabel(k)}분)</option>`);
    }
  });
  return out.join('');
}
function ensureMonth(ym){
  if(db.months[ym])return db.months[ym];
  const[a,,c]=perMonths(ym);
  const by=billYM(ym);const bY=Number(by.slice(0,4)),bM=Number(by.slice(5,7));
  const lastDay=new Date(bY,bM,0).getDate();
  const M={info:{billDate:by+'-15',due:by+'-'+pad(lastDay),mgr:S().mgr||'',note:'',baseDate:a+'.1',currDate:c+'.1'},utils:{},meters:{},pays:{},charges:{},recon:[],warns:[],confirmed:false,baseMode:'prev'};
  const pm=db.months[prevYM(ym,2)];
  // 고정성 공과금은 전 기간 값 유지 (수도·전기는 빈칸)
  if(pm&&pm.utils)['septic','safety','mgmt','clean'].forEach(k=>{if(pm.utils[k]!=null&&pm.utils[k]!=0)M.utils[k]=pm.utils[k];});
  // 기준지침 자동: 전 기간 금월지침 → 이번 기간 기준지침, 금월지침은 빈칸
  activeShops().forEach(s=>{
    const prev=pm&&pm.meters&&pm.meters[s.id]?pm.meters[s.id].curr:'';
    M.meters[s.id]={base:prev||'',curr:''};
  });
  M.floorMeters={};
  [1,2,3].forEach(f=>{const pfm=pm&&pm.floorMeters&&pm.floorMeters[f];M.floorMeters[f]={base:(pfm&&pfm.curr)||'',curr:''};});
  db.months[ym]=M;save();
  return M;
}

function saveAdj(ym,sid){
  const M=db.months[ym];M.pays=M.pays||{};
  const p=M.pays[sid]=M.pays[sid]||{paid:0,date:'',note:'',adj:0};
  p.adj=Number(String(document.getElementById('adjAmt').value).replace(/[^0-9-]/g,''))||0;
  calcMonth(ym);adjEdit=false;save();render();toast('조정금액이 반영되었습니다');
}
function addMeterShop(ym,sid,f){
  const s=db.shops.find(x=>x.id===sid);if(!s)return;
  s.wFloor=f||1;
  const M=db.months[ym];M.meters[sid]=M.meters[sid]||{base:'',curr:''};
  meterAddOpen=false;save();render();
  toast(s.unit+'호 계량기 추가('+s.wFloor+'층 연결) — 지침을 입력하세요');

function doCalc(ym){
  ensureMonth(ym);calcMonth(ym);save();
  calcOpen=null;calcDetailSid=null;render();
  setTimeout(()=>{const el=document.getElementById('calcResult');if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth'});},60);
  toast('계산 완료 — 업체별 청구액을 확인하세요');
}
function confirmBill(ym){
  const M=db.months[ym];
  const shops=activeShops();
  if(!M.confirmed){
    calcMonth(ym);
    const tot=shops.reduce((a,s)=>a+((M.charges[s.id]||{}).base||0)+((M.charges[s.id]||{}).adj||0),0);
    if(!confirm(shops.length+'개 업체의 총 청구액 '+fmt(tot)+'원을\n확정하시겠습니까?'))return;
    M.confirmed=true;save();render();
    toast('청구 확정 — 수납 화면에 전달되었습니다');
  }else{
    const noti=Object.values(M.pays||{}).some(p=>p&&p.notified);
    if(noti&&!confirm('⚠️ 이미 관리비를 통지한 업체가 있습니다.\n확정을 해제하고 수정하면 다시 통지해야 할 수 있습니다.\n계속할까요?'))return;
    if(!confirm('확정을 해제할까요? (수납 기록은 유지됩니다)'))return;
    M.confirmed=false;save();render();

}

function saveShop(e,id){
  e.preventDefault();
  const f=new FormData(e.target);
  const part={};COSTS.forEach(([k])=>part[k]=Number(f.get('part_'+k))||0);
  const data={unit:f.get('unit').trim(),name:f.get('name').trim(),
    owner:f.get('owner').trim(),phone:f.get('phone').trim(),status:f.get('status'),meterNo:f.get('meterNo').trim(),part,
    wFloor:Number(f.get('wFloor'))||0,wcFloor:Number(f.get('wcFloor'))||0,wcW:Number(f.get('wcW'))||1};
  if(id){Object.assign(db.shops.find(x=>x.id===id),data);toast('수정되었습니다');}
  else{db.shops.push({id:uid(),...data});toast('업체가 등록되었습니다');}
  save();shopEdit=null;render();
}
function delShop(id){
  const s=db.shops.find(x=>x.id===id);
  if(!confirm(s.name+'을(를) 삭제할까요?\n과거 청구 내역에서도 함께 제외됩니다.'))return;
  db.shops=db.shops.filter(x=>x.id!==id);save();shopEdit=null;render();
}

/* ── 청구·수납 ── */
function vPay(){
  const ym=payYM;
  const M=db.months[ym];
  const shops=activeShops();
  if(viewParam){viewParam=null;}
  let tot=0,paid=0,paidCnt=0,unpaidCnt=0;
  const conf=M&&M.confirmed;
  if(conf)shops.forEach(s=>{const ch=M.charges[s.id];if(!ch)return;const p=(M.pays||{})[s.id]||{};
    tot+=ch.total;paid+=p.paid||0;
    if((p.paid||0)>=ch.total&&ch.total>0)paidCnt++;else unpaidCnt++;});
  if(payFilter==null)payFilter=unpaidCnt>0?'unpaid':'all';
  const stOf=s=>{const ch=(M&&M.charges?M.charges[s.id]:null)||{total:0};const p=(M&&M.pays?M.pays[s.id]:null)||{};
    if((p.paid||0)>=ch.total&&ch.total>0)return '납부';
    if((p.paid||0)>0)return '부분납부';
    return '미납';};
  let list=shops.filter(s=>{const st=stOf(s);
    if(payFilter==='paid'&&st!=='납부')return false;
    if(payFilter==='unpaid'&&st==='납부')return false;
    if(paySearch&&!(s.name.includes(paySearch)||String(s.unit).includes(paySearch)))return false;
    return true;});
  const rowS='display:flex;align-items:center;min-height:48px;padding:0 18px;border-bottom:1px solid #f1f5f9;font-size:16px';
  const amtS='margin-left:auto;font-size:18px;font-weight:800;white-space:nowrap';
  return `<div style="padding:2px 4px 10px">
    <div style="font-size:21px;font-weight:800;color:#1f2937">관리비 수납</div>
    <select style="width:auto;margin-top:7px;font-weight:700" onchange="payYM=this.value;calcYM=this.value;S().curPeriod=this.value;save();payFilter=null;payDetailSid=null;payEditSid=null;render()">${ymOptions(ym)}</select>
  </div>
  ${!conf?`<div class="card"><div class="empty">${ym.slice(0,4)}년 ${perLabel(ym)}분 청구가 아직 확정되지 않았습니다.<br><button class="btn primary mt" onclick="calcYM='${ym}';go('calc')">계산 화면으로 이동</button></div></div>`:`
  <div class="card" style="padding:0;border-radius:16px;overflow:hidden;margin-bottom:14px">

function periodRange(ym){
  const[a,b]=perMonths(ym);
  const y=Number(ym.slice(0,4));
  const start=new Date(y,a-1,1);
  const end=new Date(y,b,0);
  return{start,end,days:Math.round((end-start)/86400000)+1,a,b,endDay:end.getDate()};
}
function splitCalc(ym,sid){
  const M=db.months[ym];const p=((M.pays||{})[sid])||{};const sp=p.split;
  if(!sp||!sp.date)return null;
  const ch=(M.charges||{})[sid]||{items:{},base:0,adj:0};
  const pr=periodRange(ym);
  const cd=new Date(sp.date+'T00:00:00');
  if(!(cd>=pr.start&&cd<pr.end))return null;
  const daysA=Math.round((cd-pr.start)/86400000)+1;
  const daysB=pr.days-daysA;
  const rows=[];let totA=0,totB=0;
  ITEM_KEYS.forEach(k=>{const amt=ch.items[k];if(!amt)return;
    const a2=Math.round(amt*daysA/pr.days);const b2=amt-a2;
    rows.push([invLabel(k,ym),a2,b2]);totA+=a2;totB+=b2;});
  if(ch.adj){const a2=Math.round(ch.adj*daysA/pr.days);rows.push(['조정금액',a2,ch.adj-a2]);totA+=a2;totB+=ch.adj-a2;}
  const nd=new Date(cd);nd.setDate(nd.getDate()+1);
  return{daysA,daysB,days:pr.days,rows,totA,totB,
    rangeA:pr.a+'.1 ~ '+(cd.getMonth()+1)+'.'+cd.getDate(),
    rangeB:(nd.getMonth()+1)+'.'+nd.getDate()+' ~ '+pr.b+'.'+pr.endDay};
}

  const p=((db.months[ym].pays||{})[sid])||{};

  return `<div style="color:#b45309;font-size:13px;font-weight:700;margin-top:3px">업체변경 분할 — ${esc(p.split.prev||'전업체')} ${fmt(r.totA)}원 (${r.rangeA}) · ${esc(p.split.cur||'현업체')} ${fmt(r.totB)}원 (${r.rangeB})</div>`;
}

function saveSplit(ym,sid){
  const t=String(document.getElementById('spDate').value||'').trim();

  if(!mch)return toast('날짜를 8.11 형식으로 입력하세요');

const invLabel=(k,ym)=>{const[a,b]=perMonths(ym);return{waterOwn:'전용 수도요금',waterFC:'층 공용 수도요금',waterAC:'전체 공용 수도요금',elec1:a+'월 공용 전기요금',elec2:b+'월 공용 전기요금',septic:'정화조 청소비',safety:'전기·소방 안전관리비',mgmt:'상가 관리비',clean:'상가 청소비',etc:'기타비용'}[k]||k;};
const fmtKDate=ds=>ds?ds.slice(0,4)+'. '+Number(ds.slice(5,7))+'. '+Number(ds.slice(8,10))+'.':'';
function invoiceText(ym,sid){
  const M=db.months[ym];const s=db.shops.find(x=>x.id===sid);
  const ch=(M.charges||{})[sid]||{items:{},total:0,usage:0,carry:0,adj:0};

  const cv=document.createElement('canvas');cv.width=W;cv.height=pad*2+lh*lines.length;

  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='#c7d2fe';ctx.lineWidth=6;ctx.strokeRect(3,3,cv.width-6,cv.height-6);

  lines.forEach((ln,i)=>{

  return cv;
}

  const rows=[['호수','업체명','사용량(톤)',...ITEM_KEYS.map(k=>itemLabel(k,ym)),'미납이월','조정','최종청구','납부액','미납액','상태','납부일','입금자']];
  shops.forEach(s=>{const ch=M.charges[s.id]||{items:{}};const p=(M.pays||{})[s.id]||{};
    rows.push([s.unit,s.name,ch.usage||0,...ITEM_KEYS.map(k=>ch.items[k]||0),ch.carry||0,ch.adj||0,ch.total||0,p.paid||0,(ch.total||0)-(p.paid||0),payStatus(M,s.id),p.date||'',p.payer||'']);});
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');

  a.download='관리비_'+ym+'.csv';a.click();toast('CSV 다운로드');
}

function ledgerEntries(){
  const ev=[];
  Object.keys(db.months).forEach(ym=>{
    const M=db.months[ym];
    Object.keys(M.pays||{}).forEach(sid=>{
      const p=M.pays[sid];if(!p||!p.paid)return;
      const s=db.shops.find(x=>x.id===sid);
      ev.push({d:p.date||billYM(ym)+'-28',kind:'in',cat:(s?s.unit+'호 관리비':'관리비'),amt:p.paid,memo:(p.note||''),auto:true,sid:sid,pym:ym});
    });
  });
  db.ledger.forEach(l=>ev.push({...l,d:l.date,cat:l.category,amt:l.amount}));
  return ev.sort((a,b)=>b.d.localeCompare(a.d));
}

function yearsOfLedger(){
  const ys=new Set(ledgerEntries().map(e=>e.d.slice(0,4)));
  Object.keys(S().openBal||{}).forEach(y=>ys.add(y));
  Object.keys(db.months).forEach(k=>ys.add(k.slice(0,4)));
  ys.add(String(new Date().getFullYear()));
  return [...ys].sort();
}
function hasYearData(y){return ledgerEntries().some(e=>e.d.startsWith(y));}
function yearInc(y){return ledgerEntries().filter(e=>e.d.startsWith(y)&&e.kind==='in').reduce((a,e)=>a+e.amt,0);}
function yearOut(y){return ledgerEntries().filter(e=>e.d.startsWith(y)&&e.kind==='out').reduce((a,e)=>a+e.amt,0);}
function openingBal(y,depth){
  depth=depth||0;const ob=S().openBal||{};const py=String(Number(y)-1);
  if(depth>30)return Number(ob[y])||0;
  if(hasYearData(py)||ob[py]!=null)return openingBal(py,depth+1)+yearInc(py)-yearOut(py);
  return Number(ob[y])||0;
}

function initSignPad(){
  const cv=document.getElementById('signPad');if(!cv||cv._init)return;cv._init=true;
  const ctx=cv.getContext('2d');ctx.lineWidth=3.5;ctx.lineCap='round';ctx.strokeStyle='#1f2937';
  const l=db.ledger.find(x=>x.id===rcptId);
  if(l&&l.receipt&&l.receipt.sign){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,cv.width,cv.height);img.src=l.receipt.sign;}
  const pos=e=>{const rc=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return[(p.clientX-rc.left)*cv.width/rc.width,(p.clientY-rc.top)*cv.height/rc.height];};
  let dr=false;
  const st=e=>{dr=true;const[x,yy]=pos(e);ctx.beginPath();ctx.moveTo(x,yy);e.preventDefault();};
  const mv=e=>{if(!dr)return;const[x,yy]=pos(e);ctx.lineTo(x,yy);ctx.stroke();e.preventDefault();};
  const en=()=>{dr=false;};
  cv.addEventListener('mousedown',st);cv.addEventListener('mousemove',mv);window.addEventListener('mouseup',en);
  cv.addEventListener('touchstart',st,{passive:false});cv.addEventListener('touchmove',mv,{passive:false});cv.addEventListener('touchend',en);
}
function clearSign(){const cv=document.getElementById('signPad');if(cv)cv.getContext('2d').clearRect(0,0,cv.width,cv.height);}
function saveReceipt(id){
  const l=db.ledger.find(x=>x.id===id);if(!l)return;
  const cv=document.getElementById('signPad');
  l.receipt={name:document.getElementById('rcName').value.trim(),birth:document.getElementById('rcBirth').value.trim(),sign:cv?cv.toDataURL('image/png'):'',saved:todayStr()};
  save();render();toast('영수증이 보관되었습니다');
}
function downloadReceipt(id){
  const l=db.ledger.find(x=>x.id===id);if(!l)return;
  const r=l.receipt||{};
  const W=700,H=560;const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#6366f1';ctx.lineWidth=5;ctx.strokeRect(12,12,W-24,H-24);
  ctx.fillStyle='#111827';ctx.textAlign='center';
  const y4=l.date.slice(0,4),mo=Number(l.date.slice(5,7)),dd=Number(l.date.slice(8,10));
  ctx.font="bold 34px 'Apple SD Gothic Neo','Malgun Gothic',sans-serif";ctx.fillText(l.category+' 영수증',W/2,85);
  ctx.font="25px 'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
  ctx.fillText(y4+'년 '+mo+'월 '+l.category+(l.category==='청소비'?'(소모품비 포함)':''),W/2,170);
  ctx.fillText(fmt(l.amount)+'원을 받았음을 정히 영수함.',W/2,212);
  ctx.fillText(y4+'년 '+mo+'월 '+dd+'일',W/2,290);
  ctx.textAlign='left';
  ctx.fillText('수령인: '+(r.name||'            ')+'  (서명)',70,380);
  ctx.fillText('생년월일: '+(r.birth||''),70,440);
  const fin=()=>{cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='영수증_'+l.category+'_'+l.date+'.png';a.click();toast('영수증 이미지 저장');});};
  if(r.sign){const img=new Image();img.onload=()=>{ctx.drawImage(img,340,330,290,90);fin();};img.src=r.sign;}else fin();
}
function delExpense(id){
  if(!confirm('이 거래를 삭제할까요?\n삭제하면 이후 잔액이 자동 재계산됩니다.'))return;
  db.ledger=db.ledger.filter(l=>l.id!==id);
  expEdit=null;expFormOpen=false;ledgerDetail=null;if(rcptId===id)rcptId=null;
  save();render();
}

function saveSet(){
  S().buildingName=document.getElementById('setName').value.trim()||'우리상가';
  S().mgr=document.getElementById('setMgr').value.trim();
  S().account=document.getElementById('setAcct').value.trim();

  if(u)S().unitRound=Number(u.value);if(d)S().dispRound=Number(d.value);if(sh)S().shareRound=Number(sh.value);
  save();render();toast('설정이 저장되었습니다');
}
function resetAll(){
  if(!confirm('모든 데이터(업체·계산·수납·출납부·설정)를 삭제하고 처음부터 시작할까요?'))return;
  if(!confirm('정말 초기화할까요?\n클라우드에 저장된 데이터도 함께 초기화되며 되돌릴 수 없습니다.\n(백업을 먼저 받는 것을 권장합니다)'))return;
  db={shops:[],months:{},ledger:[],settings:{}};migrateDb();save();view='home';render();toast('초기화되었습니다 — 처음부터 시작합니다');
}
async function checkUpdate(){
  toast('버전 확인 중...');
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});
    const t=await r.text();
    const m=t.match(/버전 (b[0-9a-z]+)/);
    if(!m){toast('버전 확인 실패');return;}
    if(m[1]===APP_VER){toast('현재 최신 버전입니다 ('+APP_VER+')');return;}
    if(confirm('새 버전 '+m[1]+' 이 있습니다.\n지금 업데이트할까요?\n(입력한 데이터는 그대로 유지됩니다)'))doUpdate();
  }catch(e){toast('버전 확인 실패 — 인터넷 연결을 확인하세요');}
}
async function doUpdate(){
  try{
    if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();}
    if(window.caches){const ks=await caches.keys();for(const k of ks)await caches.delete(k);}
  }catch(e){}
  location.replace(location.pathname+'?u='+Date.now());
}
function exportData(){
  S().lastBackup=todayStr();save();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));
  a.download='상가관리비_백업_'+todayStr()+'.json';a.click();toast('백업 파일 다운로드');render();
}
document.getElementById('importFile').addEventListener('change',function(){
  const f=this.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.shops)throw 0;
    if(!confirm('현재 데이터를 백업 파일로 교체할까요?'))return;
    db=d;migrateDb();save();render();toast('복원되었습니다');
  }catch(e){toast('올바른 백업 파일이 아닙니다');}};
  r.readAsText(f);this.value='';
});

function render(){
  try{
  document.getElementById('brandSub').textContent=S().buildingName;
  document.getElementById('tabbar').innerHTML=TABS.map(([id,ico,lbl])=>
    `<button class="${view===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${lbl}</button>`).join('');

  if(view==='home')el.innerHTML=vHome();
  else if(view==='calc')el.innerHTML=vCalc();
  else if(view==='shops')el.innerHTML=vShops();
  else if(view==='pay')el.innerHTML=vPay();
  else if(view==='ledger')el.innerHTML=vLedger();
  else if(view==='settings')el.innerHTML=vSettings();
  if(view==='ledger'&&rcptId)setTimeout(initSignPad,30);
  }catch(err){
    console.error(err);
    const el=document.getElementById('main');
    if(el)el.innerHTML='<div class="card" style="border-left:5px solid var(--bad)"><b>⚠️ 화면 표시 중 오류</b><div class="muted" style="margin:8px 0">'+esc(String(err&&err.message||err))+'</div><button class="btn primary" onclick="view=\'home\';render()">홈으로</button></div>';
  }
}

window.applyCloudDb=(d)=>{db=d;migrateDb();save();render();};
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { initializeFirestore,persistentLocalCache,doc,getDoc,setDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig={
  apiKey:"AIzaSyBaSAZBrkbtqNBSYO8w2IYZami6iMAnEeY",

  projectId:"studiomuse-app",

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

function errKo(e){const c=(e&&e.code)||'';
  if(c.includes('invalid-email'))return '이메일 형식이 올바르지 않습니다';
  if(c.includes('missing-password')||c.includes('weak-password'))return '비밀번호는 6자 이상 입력하세요';
  if(c.includes('email-already-in-use'))return '이미 가입된 이메일입니다. 로그인해 주세요';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return '이메일 또는 비밀번호가 올바르지 않습니다';
  if(c.includes('too-many-requests'))return '시도가 너무 많습니다. 잠시 후 다시 시도하세요';
  return '오류: '+c;}
